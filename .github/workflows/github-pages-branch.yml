# Alternativa si deploy-pages sigue en 404:
# Settings → Pages → Source: "Deploy from a branch" → branch gh-pages → / (root)
name: GitHub Pages (rama gh-pages)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar carpeta web en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
