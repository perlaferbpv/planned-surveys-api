<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planned surveys to xml (WITSML)</title>
    <style>
      @font-face {
        font-family: "SLB Sans";
        src: url("fonts/SLBSans-Regular.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "SLB Sans";
        src: url("fonts/SLBSans-Regular.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --slb-brand: #0014dc;
        --slb-brand-hover: #0012be;
        --slb-panel: #9fadcd;
        --slb-panel-hover: #8f9ebe;
        --text: #55585e;
        --label-size: 14px;
        font-family: "SLB Sans", Aptos, "Segoe UI", Arial, sans-serif;
        font-size: 12px;
        color: var(--text);
        background: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px 28px 32px;
        min-width: 960px;
        font-style: normal;
      }
      .top-bar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
        min-height: 98px;
      }
      .page-title {
        margin: 0;
        flex: 1;
        font-size: 22px;
        font-weight: 700;
        color: var(--slb-brand);
        line-height: 1.25;
        padding: 0 0 10px;
        letter-spacing: 0.01em;
      }
      .top-bar-right {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        flex-shrink: 0;
      }
      .top-actions {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .action-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 88px;
      }
      .action-label {
        font-size: var(--label-size);
        font-weight: 700;
        color: var(--text);
        text-align: center;
        line-height: 1.2;
        margin-bottom: 4px;
        min-height: 28px;
      }
      .action-btn {
        width: 72px;
        height: 72px;
        border: none;
        border-radius: 10px;
        background: var(--slb-panel);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .action-btn:hover {
        background: var(--slb-panel-hover);
      }
      .action-btn svg {
        width: 40px;
        height: 40px;
      }
      #btnExport,
      #btnClear {
        background: var(--slb-brand);
        border: 1px solid #fff;
      }
      #btnExport:hover,
      #btnClear:hover {
        background: var(--slb-brand-hover);
      }
      .icon-export,
      .icon-clear {
        display: block;
        width: 44px;
        height: 44px;
        background-color: #fff;
        mask: center / contain no-repeat;
        -webkit-mask: center / contain no-repeat;
      }
      .icon-export {
        mask-image: url("icons/export-as-xml.png");
        -webkit-mask-image: url("icons/export-as-xml.png");
      }
      .icon-clear {
        mask-image: url("icons/clear-sheet.png");
        -webkit-mask-image: url("icons/clear-sheet.png");
      }
      .logo {
        height: 83px;
        width: auto;
        max-width: 311px;
        object-fit: contain;
        margin-left: 8px;
        align-self: center;
      }
      .section-title {
        color: var(--text);
        font-size: var(--label-size);
        font-weight: 700;
        margin: 0 0 8px;
      }
      #pasteArea {
        width: 100%;
        min-height: 36px;
        height: 36px;
        resize: vertical;
        border: 1px solid #9fadcd;
        padding: 8px 10px;
        font: inherit;
        color: var(--text);
        margin-bottom: 28px;
      }
      #pasteArea:focus {
        outline: 2px solid var(--slb-panel);
        outline-offset: 1px;
      }
      .preview-wrap {
        width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th,
      td {
        border: 1px solid #9fadcd;
        text-align: center;
        padding: 6px 4px;
        font-size: 12px;
        color: var(--text);
      }
      thead tr#headerNames th,
      thead tr.units th {
        background: var(--slb-panel);
        color: var(--text);
        font-weight: 700;
      }
      thead tr.mapping th {
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
        line-height: 1.25;
        padding: 4px;
        word-break: break-word;
        background: var(--slb-panel);
      }
      thead tr.mapping th.unmapped {
        color: #a33;
        background: #e8d4d4;
      }
      tbody td {
        background: #fff;
        height: 28px;
      }
      tbody tr.placeholder td {
        color: transparent;
      }
    </style>
  </head>
  <body>
    <header class="top-bar">
      <h1 class="page-title">Planned surveys to xml (WITSML)</h1>
      <div class="top-bar-right">
        <div class="top-actions">
          <div class="action-wrap">
            <span class="action-label">Export as xml</span>
            <button type="button" class="action-btn" id="btnExport" title="Export as xml">
              <span class="icon-export" aria-hidden="true"></span>
            </button>
          </div>
          <div class="action-wrap">
            <span class="action-label">Clear</span>
            <button type="button" class="action-btn" id="btnClear" title="Clear">
              <span class="icon-clear" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <img
          class="logo"
          src="slb-logo-positive.png"
          width="276"
          height="83"
          alt="SLB"
        />
      </div>
    </header>

    <section>
      <h2 class="section-title">Paste the columns here</h2>
      <textarea
        id="pasteArea"
        rows="1"
        spellcheck="false"
        placeholder=""
        aria-label="Paste the columns here"
      ></textarea>
    </section>

    <section class="preview-wrap">
      <h2 class="section-title">Preview in csv</h2>
      <table id="previewTable">
        <thead>
          <tr id="headerNames">
            <th>md</th>
            <th>incl</th>
            <th>azi</th>
            <th>tvd</th>
            <th>mdDelta</th>
            <th>vertSect</th>
            <th>dls</th>
            <th>dispNs</th>
            <th>dispEw</th>
          </tr>
          <tr class="units">
            <th>m</th>
            <th>deg</th>
            <th>deg</th>
            <th>m</th>
            <th>m</th>
            <th>m</th>
            <th>deg/30m</th>
            <th>m</th>
            <th>m</th>
          </tr>
          <tr class="mapping" id="mappingRow"></tr>
        </thead>
        <tbody id="previewBody"></tbody>
      </table>
    </section>

    <script type="module">
      import {
        buildPlannedSurveysXml,
        parsePastedSurvey,
        encodeUtf8NoBom,
        DEFAULT_META,
        STATION_FIELDS,
      } from "./witsml.js";

      const pasteArea = document.getElementById("pasteArea");
      const previewBody = document.getElementById("previewBody");
      const mappingRow = document.getElementById("mappingRow");

      const PREVIEW_ROWS = 12;
      let currentStations = [];

      function renderMappingRow(sourceLabels) {
        mappingRow.innerHTML = "";
        for (const field of STATION_FIELDS) {
          const th = document.createElement("th");
          const label = sourceLabels[field] ?? "—";
          th.textContent = label === "—" ? "—" : `← ${label}`;
          if (label === "—") th.classList.add("unmapped");
          th.title =
            label === "—"
              ? "No column matched for this field"
              : `Source column: ${label}`;
          mappingRow.appendChild(th);
        }
      }

      function renderPreview(stations, sourceLabels) {
        currentStations = stations;
        renderMappingRow(sourceLabels);
        previewBody.innerHTML = "";
        const total = Math.max(PREVIEW_ROWS, stations.length);
        for (let i = 0; i < total; i++) {
          const tr = document.createElement("tr");
          if (i >= stations.length) tr.classList.add("placeholder");
          for (const field of STATION_FIELDS) {
            const td = document.createElement("td");
            td.textContent = stations[i]?.[field] ?? "";
            tr.appendChild(td);
          }
          previewBody.appendChild(tr);
        }
      }

      function clearAll() {
        pasteArea.value = "";
        currentStations = [];
        renderPreview([], Object.fromEntries(STATION_FIELDS.map((f) => [f, "—"])));
      }

      function applyPaste() {
        const text = pasteArea.value.trim();
        if (!text) {
          clearAll();
          return;
        }
        const { stations, sourceLabels } = parsePastedSurvey(text);
        if (!stations.length) {
          renderPreview([], sourceLabels);
          return;
        }
        renderPreview(stations, sourceLabels);
      }

      function exportXml() {
        if (!currentStations.length) {
          applyPaste();
        }
        if (!currentStations.length) {
          alert("Paste survey data with headers or columns B–J.");
          return;
        }
        const xml = buildPlannedSurveysXml(currentStations, DEFAULT_META);
        const blob = new Blob([encodeUtf8NoBom(xml)], {
          type: "application/xml;charset=utf-8",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "Planned_surveys_.xml";
        a.click();
        URL.revokeObjectURL(a.href);
      }

      pasteArea.addEventListener("paste", () => {
        setTimeout(applyPaste, 0);
      });
      pasteArea.addEventListener("input", applyPaste);

      document.getElementById("btnExport").addEventListener("click", exportXml);
      document.getElementById("btnClear").addEventListener("click", clearAll);

      clearAll();
    </script>
  </body>
</html>
